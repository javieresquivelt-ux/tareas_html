  <header>
    <figure>
      <img width="200" height="30" src="img/home/Conquer-Blocks-logo.avif" alt="Academia Conquer">

      <nav>
        <ul>

  <main>
    <h1 id="registro">Registrate en la Academia Conquer</h1>
    <p>Completa el formulario de registro para acceder a nuestros recursos.</p>

    <form action="registro.html" method="post" enctype="multipart/form-data">
      <p>
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
      </p>
      <p>
        <label for="fecha_nacimiento">Fecha Nacimiento</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>      
      </p>
      <p>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="correo@dominio.com">
      </p>
      <p>
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" required placeholder="Calle 123, Ciudad, País">
      </p>
      <p>
        <label for="pagina_web">Página web</label>
        <input type="url" id="pagina_web" name="pagina_web" required placeholder="https://www.ejemplo.com">
      </p>
      <p>
        <label for="foto">Foto</label>
        <input type="file" id="foto" name="foto" required>
      </p>
      <p>
        <label for="biografia">Biografía</label><br>
        <textarea id="biografia" name="biografia" required placeholder="Escribe una breve bio..." minlength="5" maxlength="300"></textarea>
      </p>
      <button type="submit">Registrarse</button>
      <button type="reset">Limpiar formulario</button>
    </form>
  </main>

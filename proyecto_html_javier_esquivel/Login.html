  <main>
    <h1 id="login">Inicia Sesión en la Academia Conquer</h1>
    <form action="login.html" method="post" enctype="multipart/form-data">
      <p>
        <label for="usuario">Ingresa tu correo electrónico</label>
        <input type="email" id="usuario" name="usuario" required placeholder="correo@dominio.com">
      </p>
      <p>
        <label for="contrasena">Ingresa tu contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required placeholder="Contraseña">
      </p>
      <button type="submit">Iniciar Sesión</button>
      <button type="reset">Limpiar formulario</button>
    </form>
  </main>

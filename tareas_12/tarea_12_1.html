<!doctype html>
<html lang="es">

<head>

    <!-- Título para el navegador y los buscadores -->
    <title>Formulario de registro - Mi web</title>

    <!-- Descripción de la página para los buscadores -->
    <meta name="description" content="Tareas clase 12 Formularios en HTML">

    <!-- Palabras clave para los buscadores -->
    <meta name="keywords" content="p, h1, h2, h3, h4, h5">

    <!-- Autor de la página -->
    <meta name="author" content="javieresquivelt@gmail.com">

    <!-- Favicon de la página -->
    <link rel="icon" href="favicon.jpg" type="image/x-icon">

    <!-- Codificación-->
    <meta charset="UTF-8">

    <!-- Para que la web sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Para algunos navegadores móviles -->
    <meta name="theme-color" content="#1e7bbf">

</head>

<body>
    <header>
        <p><a href="index.html">👈 Volver atrás</a></p>
        <hr>
    </header>

    <main>
        <h1>Formulario de registro - Mi web</h1>

        <form action="" method="get">

          <fieldset>
            <legend>Datos personales</legend>
            <p>
              <label for="name">Nombre: </label>
              <input type="text" name="nombre" id="name" maxlength="50" required autofocus placeholder="Nombre">
            </p>
            
            <p>
              <label for="apellido">Apellidos: </label>
              <input type="text" name="apellidos" id="apellido" maxlength="50" required placeholder="Apellidos">
            </p>

            <p>
              Sexo:<br>
              <input type="radio" name="sexo" value="h" id="man" required>
              <label for="man">Hombre</label>
              <input type="radio" name="sexo" value="m" id="woman" required>
              <label for="woman">Mujer</label>
            </p>

            <p>
              <label for="email">Email</label>
              <input type="email" name="email" id="email" maxlength="50" placeholder="Email">
            </p>

            <p>
              <input type="checkbox" name="news" id="news" checked>
              <label for="news">Deseo recibir información sobre novedades y ofertas</label>
            </p>

            <p>
              <input type="checkbox" name="condiciones" id="conditiones" required>
              <label for="conditiones">Declaro haber leido y acepto las condiciones generales del programa y la normativa de protección de datos</label>
            </p>

          </fieldset> 

          <fieldset>
            <legend>Otros Datos</legend>
            <p>
              <label for="pobla">Población</label>
              <select name="poblacion" id="pobla" required>
                <option value="">seleccione una opción</option>
                <option value="A">Alicante</option>
                <option value="M">Madrid</option>
                <option value="S">Sevilla</option>
                <option value="V">Valencia</option>
              </select>
            </p>

            <p>
              <label for="description">Descripción</label><br>
              <textarea name="descripcion" id="description" cols="40" rows="5" placeholder="Escribe aquí el contenido de tu consulta"></textarea>
            </p>

          </fieldset>
            
          <p>
            <button>Enviar</button>
          </p>

          <p>
            <input type="reset" value="Limpiar formulario">
          </p>

        </form>

    </main>

    <hr>
    <footer>
        © 2026 - Todos los derechos reservados
    </footer>
</body>

</html>

<!doctype html>
<html lang="es">

<head>

    <!-- Título para el navegador y los buscadores -->
    <title>Información sobre el producto</title>

    <!-- Descripción de la página para los buscadores -->
    <meta name="description" content="Tareas clase 12 Formularios en HTML">

    <!-- Palabras clave para los buscadores -->
    <meta name="keywords" content="p, h1, h2, h3, h4, h5">

    <!-- Autor de la página -->
    <meta name="author" content="javieresquivelt@gmail.com">

    <!-- Favicon de la página -->
    <link rel="icon" href="favicon.jpg" type="image/x-icon">

    <!-- Codificación-->
    <meta charset="UTF-8">

    <!-- Para que la web sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Para algunos navegadores móviles -->
    <meta name="theme-color" content="#1e7bbf">

</head>

<body>
    <header>
        <p><a href="index.html">👈 Volver atrás</a></p>
        <hr>
    </header>

    <main>
        <h1>Información sobre el producto</h1>

        <form action="" method="post" enctype="multipart/form-data">

          <fieldset>

            <legend>Datos básicos</legend>
            <p>
              <label for="name">Nombre</label><BR>
              <input type="text" name="nombre" id="name" maxlength="80" required autofocus placeholder="Nombre">
            </p>
            
            <p>
              <label for="descripcion">Descripción</label><BR>
              <textarea name="descripcion" id="descripcion" required placeholder="Descripción" rows="5" cols="40"></textarea>
            </p>

            <p>
              <label for="foto">Foto</label><BR>
              <input type="file" name="foto" id="foto" accept="image/*">
            </p>

            <p>
              <input type="checkbox" name="contador" id="contador">
              <label for="contador">Añadir contador de vistas</label>
            </p>

          </fieldset> 

          <fieldset>
            <legend>Datos económicos</legend>
            <table>
             <tr>
              <td>
                <label for="precio">Precio</label>
                <input type="number" name="precio" id="precio" size="2" min="0">€
              </td>
              <td>
                <label for="impuesto">Impuestos</label>
                <select name="impuesto" id="impuesto" required>
                <option value="4">4%</option>
                <option value="7">7%</option>
                <option value="16">16%</option>
                <option value="25">25%</option>
              </td>
             </tr>
             <tr>
              <td>
                <label for="promocion">Promoción</label><BR>
                <input type="radio" name="Promocion" value="n" id="promocion" required>
                <label for="promocion">Ninguna</label><BR>
                <input type="radio" name="Promocion" value="t" id="transporte" required>
                <label for="transporte">Transporte gratuito</label><BR>
                <input type="radio" name="Promocion" value="d" id="descuento" required>
                <label for="descuento">Descuento del 5%</label><BR>
              </td>
             </tr>
            </table> 

          </fieldset>
            
          <p>
            <button>Enviar</button>
          </p>
          <p>
            <input type="reset" value="Limpiar formulario">
          </p>

        </form>

    </main>

    <hr>
    <footer>
        © 2026 - Todos los derechos reservados
    </footer>

  </body>

</html>
